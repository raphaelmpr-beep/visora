name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject runtime config
        run: |
          cat > ./visora/assets/js/runtime-config.js <<'EOF'
          window.VISORA_PAGESPEED_API_KEY = "${{ secrets.PAGESPEED_API_KEY }}";
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./visora

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4